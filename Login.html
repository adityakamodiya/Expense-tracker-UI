<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Authentication</title>
    <style>

/* General styling */
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(to right, #141e30, #243b55); /* Dark Gradient */
    color: white;
}

/* Login heading */
h1 {
    font-family: 'Orbitron', sans-serif; /* Futuristic, Bold Font */
    font-size: 32px;
    color: #00e6ff;
    margin-bottom: 20px;
    text-shadow: 0 0 10px rgba(0, 230, 255, 0.7);
}

/* Login form container */
form {
    background: rgba(0, 0, 0, 0.8); /* Semi-transparent dark */
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 230, 255, 0.2);
    width: 100%;
    max-width: 400px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Input fields */
input {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border: 2px solid #00e6ff;
    border-radius: 6px;
    font-size: 16px;
    background: transparent;
    color: white;
    text-align: center;
    transition: 0.3s;
}

/* Input placeholder */
input::placeholder {
    color: rgba(255, 255, 255, 0.7);
}

/* Input focus effect */
input:focus {
    border-color: #00b3cc;
    outline: none;
    box-shadow: 0 0 10px rgba(0, 179, 204, 0.5);
}

/* Submit button */
button {
    width: 90%;
    padding: 12px;
    background: #00e6ff;
    color: #000;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

/* Button hover effect */
button:hover {
    background: #00b3cc;
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0, 179, 204, 0.6);
}

/* Error message styling */
.error {
    color: #ff4d4d;
    font-size: 14px;
    margin-bottom: 10px;
    font-weight: bold;
}

/* Responsive Design */
@media (max-width: 480px) {
    form {
        width: 90%;
        padding: 25px;
    }

    input {
        font-size: 14px;
        padding: 10px;
        width: 100%;
    }

    button {
        font-size: 16px;
        padding: 10px;
        width: 100%;
    }
}

    </style>
</head>
<body>
    <h1>Log in form</h1>
    <form id="loginForm">
        <div class="error" id="error"></div>
        <input type="text" id="username" placeholder="Name">
        <input type="password" id="password" placeholder="Password">
        <button type="submit">Submit</button>
    </form>

    <script>
        let form  = document.querySelector("form")
form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    // https://expense-tracker-backend-l100.onrender.com
    try {
        const response = await fetch("https://expense-tracker-backend-l100.onrender.com/api/authenticate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password }),
        });

        const result = await response.json();

        if (response.ok) {
            // Save the token and redirect
            localStorage.setItem("token", result.token);
            alert("Login successful!");
            window.location.href = "index.html";
        } else {
            alert(result.message);
        }
    } catch (error) {
        console.error("Error:", error);
        alert("An error occurred during login.");
    }
});

    </script>
</body>
</html>
